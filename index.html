<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERIC VS MARTIN | E&M GAME</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Rajdhani:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --sky: #A9DCEB;
  --sky-dark: #65BDD8;
  --white: #FFFFFF;
  --burgundy: #800020;
  --burgundy-light: #A8244B;
  --light: #F2FAFC;
  --text: #49202F;
  --muted: #8B6874;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 22px 14px;
  min-height: 100vh;
  color: var(--text);
  font-family: 'Rajdhani', Arial, sans-serif;
  background:
    radial-gradient(circle at 5% 5%, #FFFFFF 0%, transparent 35%),
    radial-gradient(circle at 95% 20%, #D5F0F7 0%, transparent 35%),
    linear-gradient(140deg, #E8F7FB, #FFFFFF 50%, #E4F4F8);
}

.container {
  max-width: 1000px;
  width: 100%;
  margin: auto;
}

/* HEADER */

header {
  text-align: center;
  padding: 15px 8px 28px;
}

.crown {
  font-size: 49px;
  color: var(--burgundy);
  text-shadow: 0 4px 12px #80002030;
  margin-bottom: 7px;
}

header h1 {
  margin: 0;
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(26px, 6vw, 54px);
  font-weight: 900;
  line-height: 1.3;
}

.eric-title {
  color: #4BAECF;
}

.martin-title {
  color: var(--burgundy);
}

.vs {
  color: var(--burgundy);
  font-size: .7em;
  margin: 0 7px;
}

.subtitle {
  margin-top: 11px;
  font-family: 'Orbitron', sans-serif;
  font-size: 12px;
  font-weight: 800;
  color: var(--burgundy);
  letter-spacing: 4px;
}

.top-line {
  width: 160px;
  height: 4px;
  margin: 15px auto 0;
  border-radius: 20px;
  background: linear-gradient(90deg, var(--sky), var(--burgundy));
}

/* VOTER */

.voter-panel {
  max-width: 650px;
  margin: 0 auto 32px;
  padding: 14px 20px;
  border: 1px solid #B9E3EF;
  border-radius: 16px;
  background: rgba(255,255,255,.92);
  box-shadow: 0 5px 18px #8000200C;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  flex-wrap: wrap;
}

.voter-panel label {
  font-size: 19px;
  font-weight: 800;
  color: var(--burgundy);
}

select {
  padding: 10px 15px;
  border-radius: 10px;
  border: 2px solid var(--sky);
  color: var(--burgundy);
  background: white;
  font-family: inherit;
  font-size: 17px;
  font-weight: 700;
}

/* GAME PANEL */

.game-card {
  background: rgba(255,255,255,.97);
  border: 2px solid #B8E4F0;
  border-radius: 22px;
  padding: 25px;
  box-shadow: 0 10px 30px #80002012;
}

.round-pill {
  width: fit-content;
  margin: -43px auto 18px;
  padding: 10px 32px;
  background: var(--burgundy);
  border: 2px solid white;
  border-radius: 30px;
  color: white;
  font-family: 'Orbitron', sans-serif;
  font-size: 14px;
  font-weight: 800;
  letter-spacing: 2px;
  box-shadow: 0 5px 14px #80002030;
}

.round-question {
  text-align: center;
  margin: 14px 0 26px;
  font-size: clamp(22px, 4vw, 32px);
  font-weight: 800;
  color: var(--burgundy);
}

/* PLAYERS */

.players {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 22px;
  align-items: start;
}

.player {
  min-width: 0;
  padding: 13px;
  text-align: center;
  background: #F7FCFE;
  border-radius: 17px;
  border: 1px solid #D4EDF4;
}

.player.eric-card {
  border-top: 4px solid var(--sky-dark);
  box-shadow: 0 -4px 18px #65BDD815;
}

.player.martin-card {
  border-top: 4px solid var(--burgundy);
  box-shadow: 0 -4px 18px #80002012;
}

.player h3 {
  margin: 3px 0 12px;
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(16px, 3vw, 22px);
  font-weight: 900;
}

.eric-card h3 {
  color: #3999B9;
}

.martin-card h3 {
  color: var(--burgundy);
}

.photo-frame {
  width: 100%;
  padding: 4px;
  border: 2px solid var(--sky);
  border-radius: 12px;
  background: white;
}

.martin-card .photo-frame {
  border-color: #D9A0B2;
}

/* SHOW THE WHOLE PHOTO */

.player img {
  display: block;
  width: 100%;
  height: auto;
  max-width: 100%;
  max-height: none;
  object-fit: contain;
  object-position: center;
  border-radius: 8px;
}

/* VOTE BUTTONS */

.vote-button {
  width: 100%;
  min-height: 55px;
  margin-top: 12px;
  border: 0;
  border-radius: 13px;
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(12px, 2.5vw, 17px);
  font-weight: 900;
  cursor: pointer;
  transition: .2s;
}

.vote-button:hover {
  transform: translateY(-3px);
  filter: brightness(1.04);
}

.eric-button {
  color: #3B5964;
  background: linear-gradient(110deg, #BDEAF5, #80D0E7);
  box-shadow: 0 5px 12px #65BDD830;
}

.martin-button {
  color: white;
  background: linear-gradient(110deg, #A8244B, #800020);
  box-shadow: 0 5px 12px #80002025;
}

.both-wrap {
  display: flex;
  justify-content: center;
  margin: 20px 0 5px;
}

.both-button {
  width: min(360px, 90%);
  color: var(--burgundy);
  background: white;
  border: 2px solid var(--burgundy);
  box-shadow: 0 5px 14px #80002012;
  font-size: 20px;
}

.both-button:hover {
  color: white;
  background: var(--burgundy);
}

/* MESSAGE */

.message {
  display: none;
  margin-top: 16px;
  padding: 12px;
  text-align: center;
  color: var(--burgundy);
  background: #EDF9FC;
  border: 1px solid var(--sky);
  border-radius: 10px;
  font-size: 17px;
  font-weight: 800;
}

/* ROUND RESULTS */

.quick-result {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 22px 4px 0;
  font-family: 'Orbitron', sans-serif;
  font-size: 14px;
  font-weight: 800;
}

.quick-bar {
  flex: 1;
  height: 13px;
  background: #F0DDE3;
  border-radius: 20px;
  overflow: hidden;
}

.quick-bar-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--sky), var(--sky-dark));
  transition: width .4s;
}

.quick-result span:first-child {
  color: #3999B9;
}

.quick-result span:last-child {
  color: var(--burgundy);
}

/* NAVIGATION */

.navigation {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  margin-top: 24px;
}

.nav-button {
  flex: 1;
  padding: 13px;
  color: var(--burgundy);
  background: #E5F6FA;
  border: 1px solid var(--sky);
  border-radius: 12px;
  font-family: 'Orbitron', sans-serif;
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
  transition: .2s;
}

.nav-button:hover {
  background: var(--sky);
}

/* FINAL RESULTS */

.results-card {
  margin-top: 43px;
  padding: 25px;
  background: white;
  border: 2px solid #B8E4F0;
  border-radius: 21px;
  box-shadow: 0 8px 25px #80002012;
}

.results-pill {
  width: fit-content;
  margin: -43px auto 28px;
  padding: 10px 32px;
  border-radius: 30px;
  background: var(--burgundy);
  border: 2px solid white;
  color: white;
  font-family: 'Orbitron', sans-serif;
  font-size: 15px;
  font-weight: 800;
  letter-spacing: 2px;
  box-shadow: 0 5px 14px #80002025;
}

.result-row {
  display: grid;
  grid-template-columns: 100px 1fr 70px;
  gap: 12px;
  align-items: center;
  margin: 22px 0;
  font-family: 'Orbitron', sans-serif;
  font-size: 14px;
  font-weight: 800;
}

.eric-label {
  color: #3999B9;
}

.martin-label {
  color: var(--burgundy);
}

.result-bar {
  height: 17px;
  background: #F0DDE3;
  border-radius: 20px;
  overflow: hidden;
}

.result-fill {
  width: 0%;
  height: 100%;
  border-radius: 20px;
  transition: width .5s;
}

.eric-fill {
  background: linear-gradient(90deg, #9BDFF0, #48B6D5);
}

.martin-fill {
  background: linear-gradient(90deg, #A8244B, #800020);
}

.result-percent {
  text-align: right;
  color: var(--burgundy);
}

.result-bottom {
  width: fit-content;
  max-width: 100%;
  margin: 28px auto 0;
  padding: 16px 30px;
  text-align: center;
  background: #EFF9FC;
  border: 1px solid var(--sky);
  border-radius: 14px;
  font-family: 'Orbitron', sans-serif;
  font-size: 14px;
  font-weight: 800;
  line-height: 1.8;
  color: var(--burgundy);
}

.winner {
  color: var(--burgundy);
  margin-top: 5px;
}

/* FOOTER */

footer {
  padding: 30px 10px 8px;
  text-align: center;
  color: var(--burgundy);
  font-family: 'Orbitron', sans-serif;
  font-size: 12px;
  letter-spacing: 2px;
}

footer span {
  color: var(--burgundy);
  font-size: 20px;
}

/* MOBILE */

@media (max-width: 600px) {
  body {
    padding: 17px 9px;
  }

  .game-card {
    padding: 20px 9px;
  }

  .players {
    gap: 9px;
  }

  .player {
    padding: 7px;
  }

  .player h3 {
    font-size: 14px;
  }

  .vote-button {
    min-height: 47px;
    padding: 7px 3px;
  }

  .both-button {
    font-size: 17px;
  }

  .round-pill {
    font-size: 12px;
    padding: 9px 22px;
  }

  .result-row {
    grid-template-columns: 72px 1fr 58px;
    gap: 7px;
    font-size: 11px;
  }

  .results-card {
    padding: 20px 9px;
  }

  .results-pill {
    font-size: 13px;
    padding: 10px 23px;
  }

  .voter-panel {
    gap: 8px;
  }

  .voter-panel label {
    font-size: 17px;
  }

  .nav-button {
    font-size: 11px;
    padding: 12px 5px;
  }
}
</style>
</head>

<body>
<div class="container">

<header>
  <div class="crown">♛</div>
  <h1>
    <span class="eric-title">ERIC</span>
    <span class="vs">VS</span>
    <span class="martin-title">MARTIN</span>
  </h1>
  <div class="subtitle">THE ULTIMATE BATTLE</div>
  <div class="top-line"></div>
</header>

<section class="voter-panel">
  <label for="voter">♛ PLAYER:</label>
  <select id="voter">
    <option value="">Choose your name</option>
    <option value="husseina">Husseina</option>
    <option value="layla">Layla</option>
  </select>
</section>

<main class="game-card">

  <div class="round-pill" id="progress">ROUND 1 / 9</div>
  <h2 class="round-question" id="question"></h2>

  <div class="players">

    <div class="player eric-card">
      <h3>♛ ERIC</h3>
      <div class="photo-frame">
        <img id="ericImage" src="" alt="Eric">
      </div>
      <button class="vote-button eric-button"
        onclick="submitVote('Eric')">
        VOTE ERIC
      </button>
    </div>

    <div class="player martin-card">
      <h3>♛ MARTIN</h3>
      <div class="photo-frame">
        <img id="martinImage" src="" alt="Martin">
      </div>
      <button class="vote-button martin-button"
        onclick="submitVote('Martin')">
        VOTE MARTIN
      </button>
    </div>

  </div>

  <div class="both-wrap">
    <button class="vote-button both-button"
      onclick="submitVote('Both')">
      ♛ BOTH ♛
    </button>
  </div>

  <div class="message" id="message"></div>

  <div class="quick-result">
    <span id="quickEric">0%</span>
    <div class="quick-bar">
      <div class="quick-bar-fill" id="quickBar"></div>
    </div>
    <span id="quickMartin">0%</span>
  </div>

  <div class="navigation">
    <button class="nav-button" onclick="previousRound()">
      ◀️ PREVIOUS
    </button>
    <button class="nav-button" onclick="nextRound()">
      NEXT ▶️
    </button>
  </div>

</main>

<section class="results-card">
  <div class="results-pill">♛ FINAL RESULTS ♛</div>

  <div class="result-row">
    <span class="eric-label">ERIC</span>
    <div class="result-bar">
      <div class="result-fill eric-fill" id="ericBar"></div>
    </div>
    <span class="result-percent" id="ericPercent">0.0%</span>
  </div>

  <div class="result-row">
    <span class="martin-label">MARTIN</span>
    <div class="result-bar">
      <div class="result-fill martin-fill" id="martinBar"></div>
    </div>
    <span class="result-percent" id="martinPercent">0.0%</span>
  </div>

  <div class="result-bottom">
    <div id="totalVotes">0 / 18 VOTES</div>
    <div class="winner" id="winner">♛ WAITING FOR VOTES...</div>
  </div>
</section>

<footer>
  <span>♛</span> E&M GAME BY ENZO <span>♛</span>
</footer>

</div>

<script>
const SUPABASE_URL =
  "https://jentdsqzefncwrvcrtib.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_hYILoPDfZwAzwjPC7-Bbnw_FVNUlwYv";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

const questions = [
  "First Club They Played For",
  "First Appearance with the National Team",
  "Best Look in Their Current Clubs",
  "Their Prime",
  "Best Outfit They Have Worn",
  "Best Haircut",
  "Their Look in the Latest Advertisement",
  "Their Look in the Latest World Cup",
  "Worst Photo"
];

let currentRound = 1;

function showRound() {
  document.getElementById("progress").textContent =
    "ROUND " + currentRound + " / 9";

  document.getElementById("question").textContent =
    questions[currentRound - 1];

  document.getElementById("ericImage").src =
    "images/eric-" + currentRound + ".jpg";

  document.getElementById("martinImage").src =
    "images/martin-" + currentRound + ".jpg";

  document.getElementById("message").style.display = "none";

  loadRoundResults();
}

function showMessage(text) {
  const box = document.getElementById("message");
  box.textContent = text;
  box.style.display = "block";
}

async function submitVote(choice) {
  const voter = document.getElementById("voter").value;

  if (!voter) {
    showMessage("Choose your player name first!");
    return;
  }

  const { data: existing, error: checkError } = await db
    .from("votes")
    .select("id")
    .eq("voter_id", voter)
    .eq("round_no", currentRound);

  if (checkError) {
    showMessage("Error: " + checkError.message);
    return;
  }

  if (existing && existing.length > 0) {
    showMessage("You already voted in this round!");
    return;
  }

  const { error } = await db
    .from("votes")
    .insert({
      voter_id: voter,
      round_no: currentRound,
      choice: choice
    });

  if (error) {
    if (error.code === "23505") {
      showMessage("You already voted in this round!");
    } else {
      showMessage("Vote error: " + error.message);
    }
    return;
  }

  showMessage("♛ VOTE CONFIRMED! ♛");

  await loadResults();
  await loadRoundResults();
}

async function loadRoundResults() {
  const { data, error } = await db
    .from("votes")
    .select("choice")
    .eq("round_no", currentRound);

  if (error) return;

  let eric = 0;
  let martin = 0;

  data.forEach(vote => {
    if (vote.choice === "Eric") eric++;
    if (vote.choice === "Martin") martin++;

    if (vote.choice === "Both") {
      eric += 0.5;
      martin += 0.5;
    }
  });

  const total = eric + martin;
  const ericPct = total ? (eric / total) * 100 : 0;
  const martinPct = total ? (martin / total) * 100 : 0;

  document.getElementById("quickEric").textContent =
    ericPct.toFixed(0) + "%";

  document.getElementById("quickMartin").textContent =
    martinPct.toFixed(0) + "%";

  document.getElementById("quickBar").style.width =
    ericPct + "%";
}

async function loadResults() {
  const { data, error } = await db
    .from("votes")
    .select("round_no, choice");

  if (error) {
    document.getElementById("winner").textContent =
      "COULD NOT LOAD RESULTS";
    return;
  }

  let eric = 0;
  let martin = 0;

  data.forEach(vote => {
    if (vote.choice === "Eric") eric++;
    if (vote.choice === "Martin") martin++;

    if (vote.choice === "Both") {
      eric += 0.5;
      martin += 0.5;
    }
  });

  const total = eric + martin;
  const ericPct = total ? (eric / total) * 100 : 0;
  const martinPct = total ? (martin / total) * 100 : 0;

  document.getElementById("ericPercent").textContent =
    ericPct.toFixed(1) + "%";

  document.getElementById("martinPercent").textContent =
    martinPct.toFixed(1) + "%";

  document.getElementById("ericBar").style.width =
    ericPct + "%";

  document.getElementById("martinBar").style.width =
    martinPct + "%";

  document.getElementById("totalVotes").textContent =
    data.length + " / 18 VOTES";

  let winner = "♛ IT'S A TIE!";

  if (total === 0) {
    winner = "♛ WAITING FOR VOTES...";
  } else if (eric > martin) {
    winner = "♛ ERIC WINS!";
  } else if (martin > eric) {
    winner = "♛ MARTIN WINS!";
  }

  document.getElementById("winner").textContent = winner;
}

function nextRound() {
  if (currentRound < 9) {
    currentRound++;
    showRound();
  }
}

function previousRound() {
  if (currentRound > 1) {
    currentRound--;
    showRound();
  }
}

showRound();
loadResults();

setInterval(() => {
  loadResults();
  loadRoundResults();
}, 10000);
</script>

</body>
</html>
