<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eric vs Martin - E&M Game</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --sky: #A9DCEB;
      --white: #FFFFFF;
      --burgundy: #800020;
      --navy: #142B4A;
      --light: #EAF7FB;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: var(--light);
      color: var(--navy);
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      margin: auto;
    }

    header {
      text-align: center;
      background: var(--navy);
      color: white;
      padding: 28px 15px;
      border-radius: 18px;
      margin-bottom: 22px;
    }

    header h1 {
      margin: 0 0 10px;
      font-size: 32px;
    }

    header p {
      margin: 0;
      color: var(--sky);
    }

    .panel {
      background: white;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(20,43,74,0.08);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 10px;
    }

    select {
      width: 100%;
      padding: 13px;
      border: 2px solid var(--sky);
      border-radius: 10px;
      font-size: 16px;
      color: var(--navy);
      background: white;
    }

    .round-title {
      text-align: center;
      color: var(--burgundy);
      font-size: 23px;
      margin: 10px 0 20px;
    }

    .players {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 15px;
      align-items: start;
    }

    .player {
      min-width: 0;
      background: var(--light);
      padding: 12px;
      border-radius: 14px;
      text-align: center;
      overflow: hidden;
    }

    .player h3 {
      color: var(--navy);
      margin: 5px 0 12px;
      font-size: 21px;
    }

    /* الصور تظهر كاملة مهما كان طولها أو عرضها */
    .player img {
      display: block;
      width: 100%;
      height: auto;
      max-width: 100%;
      max-height: none;
      object-fit: contain;
      object-position: center;
      border-radius: 10px;
      background: white;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 20px;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 10px;
      padding: 13px 8px;
      font-size: 16px;
      font-weight: bold;
      background: var(--navy);
      color: white;
      transition: 0.2s;
    }

    button:hover {
      opacity: 0.85;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .both-button {
      background: var(--burgundy);
    }

    .navigation {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 20px;
    }

    .navigation button {
      flex: 1;
      background: var(--burgundy);
    }

    .progress {
      text-align: center;
      margin: 15px 0;
      font-weight: bold;
      color: var(--navy);
    }

    .message {
      text-align: center;
      padding: 12px;
      margin-top: 15px;
      border-radius: 10px;
      font-weight: bold;
      background: var(--sky);
      color: var(--navy);
      display: none;
    }

    .results h2 {
      text-align: center;
      color: var(--burgundy);
    }

    .result-row {
      margin: 20px 0;
    }

    .result-label {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .bar {
      height: 20px;
      background: #e5e5e5;
      border-radius: 20px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      transition: width 0.4s;
    }

    .eric-fill {
      background: var(--navy);
    }

    .martin-fill {
      background: var(--burgundy);
    }

    .winner {
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      color: var(--burgundy);
      margin-top: 20px;
    }

    .total {
      text-align: center;
      color: var(--navy);
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: var(--navy);
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      header h1 {
        font-size: 25px;
      }

      .players {
        gap: 8px;
      }

      .player {
        padding: 7px;
      }

      .player h3 {
        font-size: 17px;
      }

      .choices {
        gap: 6px;
      }

      button {
        font-size: 14px;
        padding: 12px 5px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    <h1>ERIC VS MARTIN</h1>
    <p>Who is the best?</p>
  </header>

  <section class="panel">
    <label for="voter">Choose your name:</label>
    <select id="voter">
      <option value="">Select your name</option>
      <option value="husseina">Husseina</option>
      <option value="layla">Layla</option>
    </select>
  </section>

  <main id="game" class="panel">
    <div class="progress" id="progress"></div>
    <h2 class="round-title" id="question"></h2>

    <div class="players">

      <div class="player">
        <h3>ERIC</h3>
        <img id="ericImage" src="" alt="Eric photo">
      </div>

      <div class="player">
        <h3>MARTIN</h3>
        <img id="martinImage" src="" alt="Martin photo">
      </div>

    </div>

    <div class="choices">
      <button onclick="submitVote('Eric')">Eric</button>
      <button onclick="submitVote('Martin')">Martin</button>
      <button class="both-button" onclick="submitVote('Both')">Both</button>
    </div>

    <div class="message" id="message"></div>

    <div class="navigation">
      <button onclick="previousRound()">Previous</button>
      <button onclick="nextRound()">Next</button>
    </div>
  </main>

  <section class="panel results">
    <h2>FINAL RESULTS</h2>

    <div class="result-row">
      <div class="result-label">
        <span>ERIC</span>
        <span id="ericPercent">0%</span>
      </div>
      <div class="bar">
        <div class="bar-fill eric-fill" id="ericBar"></div>
      </div>
    </div>

    <div class="result-row">
      <div class="result-label">
        <span>MARTIN</span>
        <span id="martinPercent">0%</span>
      </div>
      <div class="bar">
        <div class="bar-fill martin-fill" id="martinBar"></div>
      </div>
    </div>

    <p class="total" id="totalVotes">0 / 18 votes</p>
    <div class="winner" id="winner">Waiting for votes...</div>
  </section>

  <footer>
    E&M GAME BY ENZO
  </footer>

</div>

<script>
  const SUPABASE_URL =
    "https://jentdsqzefncwrvcrtib.supabase.co";

  const SUPABASE_ANON_KEY =
    "sb_publishable_hYILoPDfZwAzwjPC7-Bbnw_FVNUlwYv";

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

  const questions = [
    "First Club They Played For",
    "First Appearance with the National Team",
    "Best Look in Their Current Clubs",
    "Their Prime",
    "Best Outfit They Have Worn",
    "Best Haircut",
    "Their Look in the Latest Advertisement",
    "Their Look in the Latest World Cup",
    "Worst Photo"
  ];

  let currentRound = 1;

  function showRound() {
    document.getElementById("progress").textContent =
      "ROUND " + currentRound + " / 9";

    document.getElementById("question").textContent =
      questions[currentRound - 1];

    document.getElementById("ericImage").src =
      "images/eric-" + currentRound + ".jpg";

    document.getElementById("martinImage").src =
      "images/martin-" + currentRound + ".jpg";

    document.getElementById("message").style.display = "none";
  }

  function showMessage(text) {
    const message = document.getElementById("message");
    message.textContent = text;
    message.style.display = "block";
  }

  async function submitVote(choice) {
    const voter = document.getElementById("voter").value;

    if (!voter) {
      showMessage("Please choose your name first.");
      return;
    }

    const { data: existing, error: checkError } = await db
      .from("votes")
      .select("id")
      .eq("voter_id", voter)
      .eq("round_no", currentRound);

    if (checkError) {
      showMessage("Error checking vote: " + checkError.message);
      return;
    }

    if (existing && existing.length > 0) {
      showMessage("You have already voted in this round!");
      return;
    }

    const { error } = await db
      .from("votes")
      .insert({
        voter_id: voter,
        round_no: currentRound,
        choice: choice
      });

    if (error) {
      if (error.code === "23505") {
        showMessage("You have already voted in this round!");
      } else {
        showMessage("Vote error: " + error.message);
      }
      return;
    }

    showMessage("Your vote has been saved!");

    await loadResults();
  }

  function nextRound() {
    if (currentRound < 9) {
      currentRound++;
      showRound();
    }
  }

  function previousRound() {
    if (currentRound > 1) {
      currentRound--;
      showRound();
    }
  }

  async function loadResults() {
    const { data, error } = await db
      .from("votes")
      .select("round_no, choice");

    if (error) {
      document.getElementById("winner").textContent =
        "Could not load results.";
      return;
    }

    let eric = 0;
    let martin = 0;

    data.forEach(vote => {
      if (vote.choice === "Eric") {
        eric += 1;
      }

      if (vote.choice === "Martin") {
        martin += 1;
      }

      if (vote.choice === "Both") {
        eric += 0.5;
        martin += 0.5;
      }
    });

    const total = eric + martin;

    const ericPercent = total === 0
      ? 0
      : (eric / total) * 100;

    const martinPercent = total === 0
      ? 0
      : (martin / total) * 100;

    document.getElementById("ericPercent").textContent =
      ericPercent.toFixed(1) + "%";

    document.getElementById("martinPercent").textContent =
      martinPercent.toFixed(1) + "%";

    document.getElementById("ericBar").style.width =
      ericPercent + "%";

    document.getElementById("martinBar").style.width =
      martinPercent + "%";

    document.getElementById("totalVotes").textContent =
      data.length + " / 18 votes";

    let winner = "It's a tie!";

    if (total === 0) {
      winner = "Waiting for votes...";
    } else if (eric > martin) {
      winner = "ERIC WINS!";
    } else if (martin > eric) {
      winner = "MARTIN WINS!";
    }

    document.getElementById("winner").textContent = winner;
  }

  showRound();
  loadResults();

  // Refresh results periodically so both voters see updates.
  setInterval(loadResults, 10000);
</script>

</body>
</html>
