<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERIC VS MARTIN | E&M GAME</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --sky: #A9DCEB;
  --sky-dark: #55B9DA;
  --white: #FFFFFF;
  --burgundy: #800020;
  --navy: #142B4A;
  --light: #EAF7FB;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 25px 15px;
  font-family: Georgia, "Times New Roman", serif;
  color: var(--navy);
  background:
    radial-gradient(ellipse at top left, white 0%, transparent 55%),
    linear-gradient(135deg, #eaf7fb, #c9eaf5, #f8fcff);
  min-height: 100vh;
}

.container {
  max-width: 1000px;
  width: 100%;
  margin: auto;
}

/* HEADER */

header {
  text-align: center;
  padding: 20px 10px 28px;
}

.crown {
  font-size: 43px;
  color: var(--burgundy);
  line-height: 1;
  margin-bottom: 5px;
}

header h1 {
  margin: 0;
  font-size: clamp(34px, 6vw, 58px);
  font-weight: 900;
  letter-spacing: 1px;
}

.eric-title {
  color: var(--burgundy);
}

.martin-title {
  color: var(--navy);
}

.subtitle {
  font-size: clamp(20px, 4vw, 30px);
  font-weight: bold;
  margin-top: 2px;
}

.subtitle-line {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 15px;
}

.subtitle-line::before,
.subtitle-line::after {
  content: "";
  height: 2px;
  background: var(--navy);
  flex: 1;
  max-width: 260px;
}

/* VOTER */

.voter-panel {
  background: linear-gradient(90deg, #bce8f5, white, #bce8f5);
  border: 2px solid white;
  border-radius: 50px;
  padding: 12px 20px;
  text-align: center;
  margin: 0 auto 30px;
  box-shadow: 0 5px 14px #142b4a18;
}

.voter-panel label {
  font-size: 19px;
  font-weight: bold;
  margin-right: 8px;
}

select {
  border: 0;
  background: white;
  color: var(--navy);
  padding: 10px 14px;
  border-radius: 12px;
  font-size: 16px;
  font-family: inherit;
}

/* GAME CARD */

.game-card {
  background: rgba(255,255,255,0.96);
  border: 2px solid var(--sky);
  border-radius: 22px;
  padding: 25px;
  box-shadow: 0 8px 22px #142b4a16;
  position: relative;
}

.round-pill {
  display: table;
  margin: -35px auto 12px;
  padding: 8px 45px;
  background: var(--burgundy);
  color: white;
  border-radius: 40px;
  font-size: 23px;
  font-weight: bold;
  letter-spacing: 1px;
}

.round-question {
  text-align: center;
  font-size: clamp(22px, 4vw, 34px);
  margin: 12px 0 20px;
  color: var(--navy);
}

/* PLAYERS */

.players {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 25px;
  align-items: start;
}

.player {
  min-width: 0;
  text-align: center;
}

.player h3 {
  font-size: 23px;
  margin: 0 0 12px;
  color: var(--navy);
}

.photo-frame {
  width: 100%;
  padding: 3px;
  border: 2px solid var(--sky);
  border-radius: 15px;
  background: white;
  overflow: hidden;
}

.player img {
  display: block;
  width: 100%;
  height: auto;
  max-width: 100%;
  max-height: none;
  object-fit: contain;
  object-position: center;
  border-radius: 10px;
}

/* VOTE BUTTONS */

.vote-button {
  width: 100%;
  margin-top: 10px;
  min-height: 58px;
  border: none;
  border-radius: 40px;
  color: white;
  font-family: inherit;
  font-size: clamp(17px, 3vw, 25px);
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 4px 9px #142b4a18;
  transition: transform 0.2s, opacity 0.2s;
}

.vote-button:hover,
.nav-button:hover {
  transform: translateY(-2px);
  opacity: 0.9;
}

.eric-button {
  background: linear-gradient(120deg, #68c5e2, #4eafd2);
}

.martin-button {
  background: linear-gradient(120deg, #92002b, #70001d);
}

.both-wrap {
  text-align: center;
  margin: 18px 0 15px;
}

.both-button {
  width: min(350px, 90%);
  min-height: 60px;
  background: linear-gradient(120deg, #193b60, #092544);
  font-size: 25px;
}

/* MESSAGE */

.message {
  display: none;
  text-align: center;
  background: var(--light);
  color: var(--navy);
  border: 1px solid var(--sky);
  border-radius: 12px;
  padding: 12px;
  margin-top: 15px;
  font-weight: bold;
}

/* NAVIGATION */

.navigation {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  margin-top: 22px;
}

.nav-button {
  flex: 1;
  padding: 14px;
  border: none;
  border-radius: 40px;
  background: var(--sky);
  color: var(--navy);
  font-family: inherit;
  font-size: 19px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
}

/* QUICK RESULT BAR */

.quick-result {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 20px 5px 0;
  font-family: Arial, sans-serif;
  font-size: 22px;
  font-weight: bold;
}

.quick-bar {
  flex: 1;
  height: 17px;
  border-radius: 30px;
  background: var(--sky);
  overflow: hidden;
}

.quick-bar-fill {
  height: 100%;
  width: 0%;
  background: var(--burgundy);
  transition: width 0.4s;
}

/* FINAL RESULTS */

.results-card {
  margin-top: 50px;
  padding: 25px;
  background: white;
  border: 2px solid var(--sky);
  border-radius: 22px;
  box-shadow: 0 8px 22px #142b4a16;
  position: relative;
}

.results-pill {
  display: table;
  margin: -38px auto 25px;
  padding: 8px 45px;
  border-radius: 40px;
  background: var(--burgundy);
  color: white;
  font-size: 23px;
  font-weight: bold;
}

.result-row {
  display: grid;
  grid-template-columns: 105px 1fr 95px;
  align-items: center;
  gap: 12px;
  margin: 20px 0;
  font-family: Arial, sans-serif;
  font-weight: bold;
  font-size: 21px;
}

.result-bar {
  height: 23px;
  border-radius: 30px;
  background: #dce7ef;
  overflow: hidden;
}

.result-fill {
  height: 100%;
  width: 0%;
  transition: width 0.5s;
  border-radius: 30px;
}

.eric-fill {
  background: var(--sky-dark);
}

.martin-fill {
  background: var(--burgundy);
}

.result-percent {
  text-align: right;
}

.result-bottom {
  width: fit-content;
  max-width: 100%;
  margin: 25px auto 0;
  padding: 15px 35px;
  border-radius: 22px;
  background: linear-gradient(120deg, #c5edf8, #a9dceB);
  text-align: center;
  font-family: Arial, sans-serif;
  font-size: 19px;
  font-weight: bold;
}

.winner {
  color: var(--burgundy);
  margin-top: 8px;
  font-size: 20px;
}

/* FOOTER */

footer {
  text-align: center;
  padding: 35px 10px 10px;
  font-size: 18px;
  color: var(--navy);
  letter-spacing: 1px;
}

footer span {
  color: var(--burgundy);
  font-size: 23px;
  margin: 0 8px;
}

/* MOBILE */

@media (max-width: 600px) {
  body {
    padding: 12px 8px;
  }

  header {
    padding: 15px 5px 25px;
  }

  .game-card {
    padding: 17px 10px;
  }

  .players {
    gap: 10px;
  }

  .player h3 {
    font-size: 18px;
  }

  .round-pill {
    font-size: 19px;
    padding: 8px 30px;
  }

  .vote-button {
    min-height: 48px;
    font-size: 16px;
    padding: 8px 4px;
  }

  .both-button {
    font-size: 21px;
  }

  .navigation {
    gap: 10px;
  }

  .nav-button {
    font-size: 16px;
    padding: 12px 5px;
  }

  .result-row {
    grid-template-columns: 75px 1fr 65px;
    gap: 7px;
    font-size: 15px;
  }

  .results-card {
    padding: 20px 10px;
  }

  .results-pill {
    font-size: 20px;
  }

  .result-bottom {
    padding: 12px 18px;
    font-size: 16px;
  }

  .voter-panel label {
    display: block;
    margin: 0 0 8px;
  }
}
</style>
</head>

<body>

<div class="container">

<header>
  <div class="crown">♛</div>
  <h1>
    <span class="eric-title">ERIC</span>
    <span>VS</span>
    <span class="martin-title">MARTIN</span>
  </h1>
  <div class="subtitle-line">
    <div class="subtitle">Who is the best?</div>
  </div>
</header>

<section class="voter-panel">
  <label for="voter">Choose your name:</label>
  <select id="voter">
    <option value="">Select your name</option>
    <option value="husseina">Husseina</option>
    <option value="layla">Layla</option>
  </select>
</section>

<main class="game-card">

  <div class="round-pill" id="progress">ROUND 1 OF 9</div>

  <h2 class="round-question" id="question"></h2>

  <div class="players">

    <div class="player">
      <h3>ERIC</h3>
      <div class="photo-frame">
        <img id="ericImage" src="" alt="Eric">
      </div>
      <button class="vote-button eric-button"
        onclick="submitVote('Eric')">
        Vote Eric
      </button>
    </div>

    <div class="player">
      <h3>MARTIN</h3>
      <div class="photo-frame">
        <img id="martinImage" src="" alt="Martin">
      </div>
      <button class="vote-button martin-button"
        onclick="submitVote('Martin')">
        Vote Martin
      </button>
    </div>

  </div>

  <div class="both-wrap">
    <button class="vote-button both-button"
      onclick="submitVote('Both')">
      ♥️ Both ♥️
    </button>
  </div>

  <div class="message" id="message"></div>

  <div class="quick-result">
    <span id="quickEric">0%</span>
    <div class="quick-bar">
      <div class="quick-bar-fill" id="quickBar"></div>
    </div>
    <span id="quickMartin">0%</span>
  </div>

  <div class="navigation">
    <button class="nav-button" onclick="previousRound()">
      ← Previous
    </button>
    <button class="nav-button" onclick="nextRound()">
      Next →
    </button>
  </div>

</main>

<section class="results-card">

  <div class="results-pill">FINAL RESULTS</div>

  <div class="result-row">
    <span>ERIC</span>
    <div class="result-bar">
      <div class="result-fill eric-fill" id="ericBar"></div>
    </div>
    <span class="result-percent" id="ericPercent">0.0%</span>
  </div>

  <div class="result-row">
    <span>MARTIN</span>
    <div class="result-bar">
      <div class="result-fill martin-fill" id="martinBar"></div>
    </div>
    <span class="result-percent" id="martinPercent">0.0%</span>
  </div>

  <div class="result-bottom">
    <div id="totalVotes">0 / 18 votes</div>
    <div class="winner" id="winner">♛ Waiting for votes...</div>
  </div>

</section>

<footer>
  ───── E&M GAME BY ENZO <span>♥️</span> ─────
</footer>

</div>

<script>
const SUPABASE_URL =
  "https://jentdsqzefncwrvcrtib.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_hYILoPDfZwAzwjPC7-Bbnw_FVNUlwYv";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

const questions = [
  "First Club They Played For",
  "First Appearance with the National Team",
  "Best Look in Their Current Clubs",
  "Their Prime",
  "Best Outfit They Have Worn",
  "Best Haircut",
  "Their Look in the Latest Advertisement",
  "Their Look in the Latest World Cup",
  "Worst Photo"
];

let currentRound = 1;

function showRound() {
  document.getElementById("progress").textContent =
    "ROUND " + currentRound + " OF 9";

  document.getElementById("question").textContent =
    questions[currentRound - 1];

  document.getElementById("ericImage").src =
    "images/eric-" + currentRound + ".jpg";

  document.getElementById("martinImage").src =
    "images/martin-" + currentRound + ".jpg";

  document.getElementById("message").style.display = "none";

  loadRoundResults();
}

function showMessage(text) {
  const box = document.getElementById("message");
  box.textContent = text;
  box.style.display = "block";
}

async function submitVote(choice) {
  const voter = document.getElementById("voter").value;

  if (!voter) {
    showMessage("Please choose your name first.");
    return;
  }

  const { data: existing, error: checkError } = await db
    .from("votes")
    .select("id")
    .eq("voter_id", voter)
    .eq("round_no", currentRound);

  if (checkError) {
    showMessage("Error: " + checkError.message);
    return;
  }

  if (existing && existing.length > 0) {
    showMessage("You have already voted in this round!");
    return;
  }

  const { error } = await db
    .from("votes")
    .insert({
      voter_id: voter,
      round_no: currentRound,
      choice: choice
    });

  if (error) {
    if (error.code === "23505") {
      showMessage("You have already voted in this round!");
    } else {
      showMessage("Vote error: " + error.message);
    }
    return;
  }

  showMessage("Your vote has been saved!");

  await loadResults();
  await loadRoundResults();
}

async function loadRoundResults() {
  const { data, error } = await db
    .from("votes")
    .select("choice")
    .eq("round_no", currentRound);

  if (error) return;

  let eric = 0;
  let martin = 0;

  data.forEach(vote => {
    if (vote.choice === "Eric") eric++;
    if (vote.choice === "Martin") martin++;
    if (vote.choice === "Both") {
      eric += 0.5;
      martin += 0.5;
    }
  });

  const total = eric + martin;
  const ericPct = total ? (eric / total) * 100 : 0;
  const martinPct = total ? (martin / total) * 100 : 0;

  document.getElementById("quickEric").textContent =
    ericPct.toFixed(0) + "%";

  document.getElementById("quickMartin").textContent =
    martinPct.toFixed(0) + "%";

  document.getElementById("quickBar").style.width =
    ericPct + "%";
}

async function loadResults() {
  const { data, error } = await db
    .from("votes")
    .select("round_no, choice");

  if (error) {
    document.getElementById("winner").textContent =
      "Could not load results.";
    return;
  }

  let eric = 0;
  let martin = 0;

  data.forEach(vote => {
    if (vote.choice === "Eric") eric++;
    if (vote.choice === "Martin") martin++;
    if (vote.choice === "Both") {
      eric += 0.5;
      martin += 0.5;
    }
  });

  const total = eric + martin;
  const ericPct = total ? (eric / total) * 100 : 0;
  const martinPct = total ? (martin / total) * 100 : 0;

  document.getElementById("ericPercent").textContent =
    ericPct.toFixed(1) + "%";

  document.getElementById("martinPercent").textContent =
    martinPct.toFixed(1) + "%";

  document.getElementById("ericBar").style.width =
    ericPct + "%";

  document.getElementById("martinBar").style.width =
    martinPct + "%";

  document.getElementById("totalVotes").textContent =
    data.length + " / 18 votes";

  let winner = "♛ It's a tie!";

  if (total === 0) {
    winner = "♛ Waiting for votes...";
  } else if (eric > martin) {
    winner = "♛ ERIC WINS!";
  } else if (martin > eric) {
    winner = "♛ MARTIN WINS!";
  }

  document.getElementById("winner").textContent = winner;
}

function nextRound() {
  if (currentRound < 9) {
    currentRound++;
    showRound();
  }
}

function previousRound() {
  if (currentRound > 1) {
    currentRound--;
    showRound();
  }
}

showRound();
loadResults();

// Refresh results every 10 seconds
setInterval(() => {
  loadResults();
  loadRoundResults();
}, 10000);
</script>

</body>
</html>
